name: NSE Daily Pipeline

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 7:00 PM IST Mon–Fri (13:30 UTC)
  workflow_dispatch:
    inputs:
      exchange:
        description: 'Exchange(s) to run — comma-separated (e.g. NSE,BSE)'
        required: false
        default: 'NSE'
      init:
        description: 'Backfill 1 year of history? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      # Set these repo secrets to switch on the WhatsApp evening update
      WHATSAPP_BOT_URL: ${{ secrets.WHATSAPP_BOT_URL }}
      BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run pipeline
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          EXCHANGE="${{ github.event.inputs.exchange || 'NSE' }}"
          INIT="${{ github.event.inputs.init || 'false' }}"
          if [ "$INIT" = "true" ] || [ ! -f output/signals.json ]; then
            echo "Running in INIT mode (backfilling 1 year)…"
            python nse_pipeline.py --init --exchange "$EXCHANGE"
          else
            echo "Running daily update for $EXCHANGE…"
            python nse_pipeline.py --exchange "$EXCHANGE"
          fi

      - name: Build WhatsApp bot feed
        run: python bot/build_feed.py

      - name: Commit signals and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Daily signals $(date -u +%Y-%m-%d) [eodhd]"
          git pull --rebase origin main
          git push

      - name: Send WhatsApp evening update
        if: ${{ env.WHATSAPP_BOT_URL != '' }}
        continue-on-error: true   # a WhatsApp problem must never fail the data pipeline
        run: |
          # Pin the bot to this exact commit so it never reads a cached older feed
          curl -fsS --max-time 240 -X POST "$WHATSAPP_BOT_URL/broadcast" \
            -H "Authorization: Bearer $BROADCAST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"$(git rev-parse HEAD)\"}"
