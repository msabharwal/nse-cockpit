name: NSE Daily Pipeline

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 7:00 PM IST Mon–Fri (13:30 UTC)
  workflow_dispatch:
    inputs:
      exchange:
        description: 'Exchange(s) to run — comma-separated (e.g. NSE,BSE)'
        required: false
        default: 'NSE'
      init:
        description: 'Backfill 1 year of history? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # kill if pipeline hangs; daily run should finish in ~20 min
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy yfinance

      - name: Restore EODHD cache
        uses: actions/cache@v4
        with:
          path: data/eodhd_cache
          key: eodhd-cache-${{ runner.os }}-${{ hashFiles('nse_pipeline.py') }}
          restore-keys: |
            eodhd-cache-${{ runner.os }}-

      - name: Run pipeline
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          EXCHANGE="${{ github.event.inputs.exchange || 'NSE' }}"
          INIT="${{ github.event.inputs.init || 'false' }}"
          if [ "$INIT" = "true" ] || [ ! -f output/signals.json ]; then
            echo "Running in INIT mode (backfilling 1 year)…"
            python nse_pipeline.py --init --exchange "$EXCHANGE"
          else
            echo "Running daily update for $EXCHANGE…"
            python nse_pipeline.py --exchange "$EXCHANGE"
          fi

      - name: Save EODHD cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/eodhd_cache
          key: eodhd-cache-${{ runner.os }}-${{ hashFiles('nse_pipeline.py') }}

      - name: Enrich — fetch news & fundamentals for top picks
        run: python nse_enrich.py

      - name: Bake dashboard HTML
        run: python bake_cockpit.py

      - name: Commit signals, HTML and fundamentals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ NSE_Cockpit.html
          git diff --staged --quiet || git commit -m "Daily signals $(date -u +%Y-%m-%d) [eodhd]"
          git pull --rebase origin main
          git push
