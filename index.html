<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSE Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════ */
:root {
  --bg:       #080b12;
  --bg2:      #0d1220;
  --bg3:      #111827;
  --bg4:      #1a2235;
  --bg5:      #1f2d44;
  --border:   #1e2d45;
  --border2:  #2a3f60;
  --fg:       #f0f4ff;
  --fg2:      #9baec8;
  --fg3:      #5a6e8a;
  --accent:   #3b82f6;
  --accent2:  #60a5fa;
  --green:    #10b981;
  --green2:   #34d399;
  --red:      #ef4444;
  --red2:     #f87171;
  --amber:    #f59e0b;
  --purple:   #8b5cf6;
  --cyan:     #06b6d4;

  /* signal colours */
  --super:    #00e5ff;   /* Super Trend  */
  --vbull:    #22c55e;   /* Very Bullish */
  --bull:     #86efac;   /* Bullish      */
  --watch:    #f59e0b;   /* Watchout     */
  --range:    #94a3b8;   /* Ranging      */

  --radius:   10px;
  --radius-sm: 6px;
  color-scheme: dark;
}

/* ═══════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}

/* ═══════════════════════════════════════════════
   LAYOUT SHELL
═══════════════════════════════════════════════ */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Top bar */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
#topbar .logo {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.3px;
  color: var(--fg);
}
#topbar .logo span { color: var(--accent2); }
#market-pulse {
  display: flex;
  gap: 10px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
#market-pulse::-webkit-scrollbar { display: none; }
.pulse-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  white-space: nowrap;
  color: var(--fg2);
  flex-shrink: 0;
}
.pulse-chip .sym { font-weight: 600; color: var(--fg); }
.pulse-chip .chg { font-family: 'JetBrains Mono', monospace; }
.pulse-chip .up { color: var(--green2); }
.pulse-chip .dn { color: var(--red2); }

#refresh-btn {
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--fg2);
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  transition: all .2s;
}
#refresh-btn:hover { background: var(--bg4); color: var(--fg); }
#refresh-btn .spin { display: inline-block; }
#refresh-btn.loading .spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Nav tabs */
#nav {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
#nav::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--fg3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.nav-tab:hover { color: var(--fg2); }
.nav-tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
.nav-tab .badge {
  background: var(--accent);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 10px;
  min-width: 16px;
  text-align: center;
}

/* Main content */
#main {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.view {
  display: none;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
}
.view.active { display: flex; flex-direction: column; }
.view-inner { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* ═══════════════════════════════════════════════
   SIGNAL BADGES
═══════════════════════════════════════════════ */
.sig {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .3px;
  text-transform: uppercase;
}
.sig-SUPER_TREND  { background: rgba(0,229,255,.12); color: var(--super); border: 1px solid rgba(0,229,255,.25); }
.sig-VERY_BULLISH { background: rgba(34,197,94,.14);  color: var(--vbull); border: 1px solid rgba(34,197,94,.3); }
.sig-BULLISH      { background: rgba(134,239,172,.1); color: var(--bull);  border: 1px solid rgba(134,239,172,.25); }
.sig-WATCH_OUT    { background: rgba(245,158,11,.12); color: var(--watch); border: 1px solid rgba(245,158,11,.25); }
.sig-RANGING      { background: rgba(148,163,184,.1); color: var(--range); border: 1px solid rgba(148,163,184,.2); }

/* ═══════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════ */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.card-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--fg3);
}

/* ═══════════════════════════════════════════════
   PICKS VIEW
═══════════════════════════════════════════════ */
.picks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.pick-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.pick-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.pick-card.cat-SUPER_TREND::before  { background: var(--super); }
.pick-card.cat-VERY_BULLISH::before { background: var(--vbull); }
.pick-card.cat-BULLISH::before      { background: var(--bull); }
.pick-card.cat-WATCH_OUT::before    { background: var(--watch); }
.pick-card.cat-RANGING::before      { background: var(--range); }
.pick-card:hover {
  border-color: var(--border2);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
}
.pick-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}
.pick-sym {
  font-size: 14px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg);
}
.pick-name {
  font-size: 10px;
  color: var(--fg3);
  margin-top: 2px;
}
.pick-price {
  text-align: right;
}
.pick-price .price {
  font-size: 15px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.pick-price .chg {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 1px;
}
.up { color: var(--green2); }
.dn { color: var(--red2); }
.neu { color: var(--fg2); }

.pick-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.metric {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.metric-label {
  font-size: 9px;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: .3px;
}
.metric-val {
  font-size: 12px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg);
}

/* RSI bar */
.rsi-bar-wrap {
  height: 3px;
  background: var(--bg5);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.rsi-bar {
  height: 100%;
  border-radius: 2px;
  transition: width .5s ease;
}

/* SL/TGT band */
.pick-trade {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.trade-pill {
  flex: 1;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  text-align: center;
}
.trade-pill.sl  { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.2); }
.trade-pill.tgt { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.2); }
.trade-pill .tp-label { color: var(--fg3); font-size: 9px; text-transform: uppercase; }
.trade-pill .tp-val   { font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 1px; }
.trade-pill.sl  .tp-val { color: var(--red2); }
.trade-pill.tgt .tp-val { color: var(--green2); }

/* ═══════════════════════════════════════════════
   UNIVERSE / ALL STOCKS VIEW
═══════════════════════════════════════════════ */
.filter-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 12px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 160px;
}
.search-wrap input {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--fg);
  padding: 7px 10px 7px 32px;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .ico {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg3);
  pointer-events: none;
  font-size: 13px;
}
.filter-pill {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border2);
  background: var(--bg4);
  color: var(--fg2);
  transition: all .15s;
  white-space: nowrap;
}
.filter-pill:hover { background: var(--bg5); color: var(--fg); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-pill.f-SUPER_TREND.active  { background: rgba(0,229,255,.2);   border-color: var(--super);  color: var(--super); }
.filter-pill.f-VERY_BULLISH.active { background: rgba(34,197,94,.2);   border-color: var(--vbull);  color: var(--vbull); }
.filter-pill.f-BULLISH.active      { background: rgba(134,239,172,.15);border-color: var(--bull);   color: var(--bull); }
.filter-pill.f-WATCH_OUT.active    { background: rgba(245,158,11,.15); border-color: var(--watch);  color: var(--watch); }
.filter-pill.f-RANGING.active      { background: rgba(148,163,184,.1); border-color: var(--range);  color: var(--range); }

/* Sort controls */
.sort-row {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.sort-row::-webkit-scrollbar { display: none; }
.sort-btn {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: none;
  color: var(--fg3);
  white-space: nowrap;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 3px;
}
.sort-btn:hover { color: var(--fg2); border-color: var(--border2); }
.sort-btn.active { color: var(--accent2); border-color: var(--accent); }

/* Stock rows */
.stock-list {
  display: flex;
  flex-direction: column;
}
.stock-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  align-items: center;
}
.stock-row:hover { background: var(--bg3); }
.stock-row-left { display: flex; align-items: center; gap: 10px; }
.sig-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.sig-dot.SUPER_TREND  { background: var(--super); box-shadow: 0 0 6px var(--super); }
.sig-dot.VERY_BULLISH { background: var(--vbull); }
.sig-dot.BULLISH      { background: var(--bull); }
.sig-dot.WATCH_OUT    { background: var(--watch); }
.sig-dot.RANGING      { background: var(--range); }
.stock-sym  { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.stock-name { font-size: 10px; color: var(--fg3); margin-top: 1px; }
.stock-row-right { text-align: right; }
.stock-price { font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.stock-chg   { font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.stock-rsi   { font-size: 10px; color: var(--fg3); margin-top: 2px; }

/* ═══════════════════════════════════════════════
   DETAIL PANEL
═══════════════════════════════════════════════ */
#detail-panel {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
#detail-panel.open { transform: translateX(0); }

#detail-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#detail-back {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--fg2);
  padding: 6px 12px;
  cursor: pointer;
  font-size: 12px;
  transition: all .2s;
}
#detail-back:hover { background: var(--bg5); color: var(--fg); }
#detail-sym  { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
#detail-name { font-size: 11px; color: var(--fg3); }

#detail-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Price hero */
.detail-hero {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.detail-price-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  margin-bottom: 12px;
}
.detail-price {
  font-size: 32px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.detail-chg {
  font-size: 14px;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 4px;
}
.detail-chg.up { background: rgba(16,185,129,.15); color: var(--green2); }
.detail-chg.dn { background: rgba(239,68,68,.12);  color: var(--red2); }
.ohlc-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.ohlc-item { display: flex; flex-direction: column; gap: 2px; }
.ohlc-label { font-size: 9px; color: var(--fg3); text-transform: uppercase; letter-spacing: .3px; }
.ohlc-val   { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

/* Candle history */
.candle-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.candle-col { display: flex; flex-direction: column; gap: 6px; }
.candle-period {
  font-size: 9px;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 600;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.candle-entry {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px;
}
.candle-date { font-size: 9px; color: var(--fg3); margin-bottom: 4px; }
.candle-oc {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}
.candle-hl {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg3);
  margin-top: 2px;
}

/* Indicators grid */
.indicators-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.ind-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.ind-label {
  font-size: 9px;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 4px;
}
.ind-val {
  font-size: 15px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.ind-sub {
  font-size: 10px;
  color: var(--fg3);
  margin-top: 2px;
}

/* MA comparison table */
.ma-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.ma-table th {
  text-align: left;
  color: var(--fg3);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .4px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
.ma-table td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
}
.ma-table tr:last-child td { border-bottom: none; }
.ma-above { color: var(--green2); }
.ma-below { color: var(--red2); }

/* ═══════════════════════════════════════════════
   WATCHLIST VIEW
═══════════════════════════════════════════════ */
.watchlist-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 60px 20px;
  color: var(--fg3);
  text-align: center;
}
.watchlist-empty .ico { font-size: 40px; opacity: .3; }
.watchlist-empty p { font-size: 13px; }

/* ═══════════════════════════════════════════════
   MARKET SUMMARY VIEW
═══════════════════════════════════════════════ */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.summary-tile {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.summary-tile .st-label { font-size: 10px; color: var(--fg3); }
.summary-tile .st-val   { font-size: 20px; font-weight: 700; }
.summary-tile .st-sub   { font-size: 10px; color: var(--fg3); }

.signal-bar-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.signal-bar-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 12px;
}
.signal-bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.signal-bar-label {
  font-size: 11px;
  font-weight: 500;
  width: 100px;
  flex-shrink: 0;
}
.signal-bar-track {
  flex: 1;
  height: 6px;
  background: var(--bg5);
  border-radius: 3px;
  overflow: hidden;
}
.signal-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .6s ease;
}
.signal-bar-count {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg2);
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════
   LOADING / ERROR STATES
═══════════════════════════════════════════════ */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 60px 20px;
  color: var(--fg3);
}
.loader {
  width: 32px;
  height: 32px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.error-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 40px 20px;
  color: var(--red2);
  text-align: center;
  font-size: 13px;
}

/* ═══════════════════════════════════════════════
   SKELETONS
═══════════════════════════════════════════════ */
.skel {
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ═══════════════════════════════════════════════
   WATCHLIST BUTTON
═══════════════════════════════════════════════ */
.wl-btn {
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--fg3);
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
  transition: all .2s;
  margin-left: auto;
}
.wl-btn:hover { background: var(--bg4); color: var(--amber); border-color: var(--amber); }
.wl-btn.in-wl { color: var(--amber); border-color: var(--amber); background: rgba(245,158,11,.08); }

/* ═══════════════════════════════════════════════
   PORTFOLIO CALC
═══════════════════════════════════════════════ */
.port-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--fg2);
  flex-shrink: 0;
}
.port-row label { white-space: nowrap; }
.port-row input {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--fg);
  padding: 4px 8px;
  font-size: 12px;
  width: 100px;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
}
.port-row input:focus { border-color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ═══════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════ */
@media (max-width: 600px) {
  .picks-grid { grid-template-columns: 1fr; }
  .candle-grid { grid-template-columns: 1fr; }
  .indicators-grid { grid-template-columns: 1fr; }
  .ohlc-row { grid-template-columns: repeat(2, 1fr); }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">NSE <span>Cockpit</span></div>
    <div id="market-pulse">
      <div class="pulse-chip"><span class="sym">Loading…</span></div>
    </div>
    <button id="refresh-btn" onclick="refreshAll()">
      <span class="spin">↻</span> Refresh

  </div>

  <!-- NAV TABS -->
  <div id="nav">

    <div class="nav-tab" data-view="universe" onclick="switchView('universe')">📊 All Stocks <span class="badge" id="badge-universe">—</span></div>

    <div class="nav-tab" data-view="watchlist" onclick="switchView('watchlist')">⭐ Watchlist <span class="badge" id="badge-wl">0</span></div>

  <!-- MAIN -->

    <!-- ── PICKS VIEW ── -->

      <div class="filter-bar">

        </div>
        <div class="filter-pill active" data-cat="ALL" onclick="setCatFilter('ALL', this)">All</div>
        <div class="filter-pill f-SUPER_TREND" data-cat="SUPER TREND" onclick="setCatFilter('SUPER TREND', this)">⚡ Super Trend</div>
        <div class="filter-pill f-VERY_BULLISH" data-cat="VERY BULLISH" onclick="setCatFilter('VERY BULLISH', this)">🔥 Very Bullish</div>
        <div class="filter-pill f-BULLISH" data-cat="BULLISH" onclick="setCatFilter('BULLISH', this)">▲ Bullish</div>

        <button class="sort-btn" data-sort="rsi-lo"  onclick="setSort('rsi-lo', this)">RSI Low</button>
        <button class="sort-btn" data-sort="chg-hi"  onclick="setSort('chg-hi', this)">Gainers</button>
        <button class="sort-btn" data-sort="chg-lo"  onclick="setSort('chg-lo', this)">Losers</button>

      </div>

      <div id="watchlist-container" style="flex:1;overflow-y:auto">

  </div><!-- /main -->
</div><!-- /app -->

<!-- DETAIL PANEL (slide-in) -->
<div id="detail-panel">
  <div id="detail-topbar">
    <button id="detail-back" onclick="closeDetail()">← Back</button>
    <div>
      <div id="detail-sym">—</div>
      <div id="detail-name">—</div>
    </div>
    <button class="wl-btn" id="detail-wl-btn" onclick="toggleWatchlist()">☆ Watch</button>
  </div>
  <div id="detail-scroll"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════════ */
const API_BASE = 'https://corsproxy.io/?https://api.equityanalyze.com/api/chartdatabyquery';
const PERIODS  = 'D-6,W-3,M-3';
const COLUMNS  = 'open,high,low,close,adj_close,rsi,sma_10-D,sma_20-D,sma_50-D,macd,macdsignal,macdhist,ema_5-D,ema_9-D,ema_26-D,volume,sma_100,sma_200,category';

// Nifty 500 representative list — the API returns all NSE, we seed
// with a solid universe of liquid names. Extend as needed.
// Nifty 500 most liquid — balanced across sectors, loads fast (~10 API calls)
const NSE_UNIVERSE = [
  // Large cap blue chips
  'RELIANCE','TCS','HDFCBANK','INFY','ICICIBANK','SBIN','BHARTIARTL','KOTAKBANK',
  'AXISBANK','LT','HCLTECH','WIPRO','BAJFINANCE','ITC','HINDUNILVR','ASIANPAINT',
  'MARUTI','SUNPHARMA','TITAN','NTPC','POWERGRID','ONGC','COALINDIA','BAJAJFINSV',
  'ADANIPORTS','ULTRACEMCO','TECHM','NESTLEIND','INDUSINDBK','DRREDDY',
  // Banks & Financials
  'CANBK','BANKBARODA','PNB','FEDERALBNK','IDFCFIRSTB','BANDHANBNK','AUBANK',
  'CHOLAFIN','MUTHOOTFIN','MANAPPURAM','LICHSGFIN','HDFCLIFE','SBILIFE','ICICIPRULI',
  'BAJAJHLDNG','RECLTD','PFC','IRFC',
  // IT & Tech
  'TATAELXSI','MPHASIS','LTTS','COFORGE','PERSISTENT','KPITTECH','NAUKRI',
  'ZOMATO','IRCTC','INDIAMART','POLICYBZR',
  // Pharma & Healthcare
  'CIPLA','DIVISLAB','LUPIN','AUROPHARMA','ALKEM','TORNTPHARM','GLENMARK',
  'APOLLOHOSP','LALPATHLAB','METROPOLIS','FORTIS','BIOCON','GRANULES',
  // Energy & Power
  'BPCL','IOC','HINDPETRO','TATAPOWER','NHPC','SJVN','ADANIGR',
  // Metals & Mining
  'JSWSTEEL','TATASTEEL','HINDALCO','VEDL','SAIL','NMDC','NALCO','APLAPOLLO',
  // Chemicals & Fertilisers
  'PIDILITIND','DEEPAKNTR','AARTIIND','TATACHEM','UPL','COROMANDEL','CHAMBAL',
  'DEEPAKFERT','GSFC','ATUL','NOCIL',
  // Consumer & FMCG
  'DABUR','MARICO','GODREJCP','TATACONSUM','JUBLFOOD','RADICO','MCDOWELL-N',
  'VSTIND','PAGEIND','TRENT','BATA','RELAXO',
  // Auto & Auto Ancillaries
  'EICHERMOT','HEROMOTOCO','ESCORTS','BOSCHLTD','MRF','APOLLOTYRE','BALKRISIND',
  'EXIDEIND','MOTHERSON','ENDURANCE','SUNDRMFAST',
  // Capital Goods & Infra
  'SIEMENS','ABB','CUMMINSIND','HAVELLS','RVNL','NCC','IRCON','GRINFRA',
  // Real Estate & Cement
  'SHREECEM','GRASIM','KAJARIA','CERA',
  // Media & Misc
  'ZEEL','SAREGAMA','CUPID','RAYMOND','VARDHMAN'
].map(s => s + '.NSE');

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let stockData   = {};   // sym -> parsed stock object
let watchlist   = new Set(JSON.parse(localStorage.getItem('wl') || '[]'));
let catFilter   = 'ALL';
let sortMode    = 'signal';
let currentSym  = null;
let portfolioAmt = 100000;

const SIGNAL_ORDER = { 'SUPER TREND': 0, 'VERY BULLISH': 1, 'BULLISH': 2, 'WATCH OUT': 3, 'RANGING': 4 };
const CAT_CSS = {
  'SUPER TREND':  'SUPER_TREND',
  'VERY BULLISH': 'VERY_BULLISH',
  'BULLISH':      'BULLISH',
  'WATCH OUT':    'WATCH_OUT',
  'RANGING':      'RANGING'
};

/* ══════════════════════════════════════════════════════════
   API
══════════════════════════════════════════════════════════ */
async function fetchStocks(symbols) {
  const sym = symbols.join(',');
  const url = `${API_BASE}?symbols=${encodeURIComponent(sym)}&date=&periods=${PERIODS}&columns=${COLUMNS}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.result !== 'success') throw new Error(json.error?.message || 'API error');
  return json.data;
}

function parseStock(raw) {
  // API returns: raw = { symbol, data: [ {period,days,data:[candles]}, ... ] }
  // data[0] = Daily period, data[1] = Weekly, data[2] = Monthly
  // Each period object has a .data array of candles
  const periods  = raw.data || [];                       // array of period objects
  const dailyObj = periods.find(p => p.period === 'Daily' || p.period === 'D') || periods[0] || {};
  const weeklyObj= periods.find(p => p.period === 'W' || p.period === 'Weekly') || periods[1] || {};
  const monthlyObj=periods.find(p => p.period === 'M' || p.period === 'Monthly')|| periods[2] || {};

  const daily   = dailyObj.data  || [];
  const weekly  = weeklyObj.data || [];
  const monthly = monthlyObj.data|| [];

  const latest  = daily[daily.length - 1] || {};
  const prev    = daily[daily.length - 2] || {};

  const close = latest.close || 0;
  const prevClose = prev.close || close;
  const chgAbs = close - prevClose;
  const chgPct = prevClose ? (chgAbs / prevClose) * 100 : 0;

  // ATR proxy from daily range for SL/TGT
  const atrPct = daily.length >= 3
    ? daily.slice(-3).reduce((s, c) => s + ((c.high - c.low) / (c.close || 1)) * 100, 0) / 3
    : 2;

  // Category — API returns e.g. "WATCH OUT", "VERY BULLISH", "RANGING" etc.
  const cat = (latest.category || 'RANGING').trim().toUpperCase();

  // Helper to grab a field that may have key variants
  const f = (obj, ...keys) => { for (const k of keys) if (obj[k] != null) return obj[k]; return 0; };

  return {
    sym:      raw.symbol || '',
    name:     raw.name   || '',
    close,
    chgAbs,
    chgPct,
    open:     latest.open     || 0,
    high:     latest.high     || 0,
    low:      latest.low      || 0,
    adjClose: latest.adj_close|| close,
    rsi:      latest.rsi      || 0,
    macd:     latest.macd     || 0,
    macdSig:  latest.macdsignal || 0,
    macdHist: latest.macdhist || 0,
    ema5:     f(latest,'ema_5','ema_5-D'),
    ema9:     f(latest,'ema_9','ema_9-D'),
    ema26:    f(latest,'ema_26','ema_26-D'),
    sma10:    f(latest,'sma_10','sma_10-D'),
    sma20:    f(latest,'sma_20','sma_20-D'),
    sma50:    f(latest,'sma_50','sma_50-D'),
    sma100:   latest.sma_100  || 0,
    sma200:   latest.sma_200  || 0,
    volume:   latest.volume   || 0,
    category: cat,
    atrPct,
    daily,
    weekly,
    monthly,
    expiry:   latest.expirydatetime || latest.date || '',
    date:     latest.date || '',
  };
}

/* ══════════════════════════════════════════════════════════
   LOAD PIPELINE
══════════════════════════════════════════════════════════ */
const BATCH = 20; // symbols per API call

async function loadAll() {
  setLoading(true);
  stockData = {};
  const batches = [];
  for (let i = 0; i < NSE_UNIVERSE.length; i += BATCH) {
    batches.push(NSE_UNIVERSE.slice(i, i + BATCH));
  }

  let done = 0;
  for (const batch of batches) {
    try {
      const rows = await fetchStocks(batch);
      if (!Array.isArray(rows)) { console.warn('Unexpected API shape:', rows); }
      else for (const row of rows) {
        const s = parseStock(row);
        if (s.sym) stockData[s.sym] = s;
        else console.warn('No sym in row:', JSON.stringify(row).slice(0,120));
      }
    } catch(e) {
      console.warn('Batch error:', batch[0], e.message);
    }
    done += batch.length;
    updateProgress(done, NSE_UNIVERSE.length);
    // Render immediately after each batch so results appear as they load
    const stocks = Object.values(stockData);
    updateBadges(stocks);
    renderPicks(stocks);
    renderUniverse(stocks);
    renderSummary(stocks);
    await new Promise(r => setTimeout(r, 0));
  }

  setLoading(false);
  renderWatchlist();
}

function updateProgress(done, total) {
  const pct = Math.round(done / total * 100);
  const el = document.getElementById('progress-label');
  if (el) el.textContent = `Loading… ${pct}%`;
}

function setLoading(on) {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.toggle('loading', on);
}

/* ══════════════════════════════════════════════════════════
   MARKET PULSE (top bar)
══════════════════════════════════════════════════════════ */
const PULSE_SYMS = ['RELIANCE.NSE','INFY.NSE','HDFCBANK.NSE','TCS.NSE','ICICIBANK.NSE','SBIN.NSE'];
let pulseLoading = false;

async function loadPulse() {
  if (pulseLoading) return;   // prevent double calls
  pulseLoading = true;
  try {
    const rows = await fetchStocks(PULSE_SYMS);
    const chips = rows.map(r => {
      const s = parseStock(r);
      const sym = s.sym.replace('.NSE','');
      const up  = s.chgPct >= 0;
      return `<div class="pulse-chip">
        <span class="sym">${sym}</span>
        <span class="chg ${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${Math.abs(s.chgPct).toFixed(2)}%</span>
      </div>`;
    }).join('');
    document.getElementById('market-pulse').innerHTML = chips || '<div class="pulse-chip"><span class="sym">—</span></div>';
  } catch(e) {
    console.warn('Pulse error', e);
  } finally {
    pulseLoading = false;
  }
}

/* ══════════════════════════════════════════════════════════
   RENDER ALL
══════════════════════════════════════════════════════════ */
function renderAll() {
  const stocks = Object.values(stockData);
  updateBadges(stocks);
  renderPicks(stocks);
  renderUniverse(stocks);
  renderSummary(stocks);
  renderWatchlist();
}

function updateBadges(stocks) {
  const bullish = stocks.filter(s => ['SUPER TREND','VERY BULLISH','BULLISH'].includes(s.category));
  document.getElementById('badge-picks').textContent    = bullish.length;
  document.getElementById('badge-universe').textContent = stocks.length;
  document.getElementById('badge-wl').textContent       = watchlist.size;
}

/* ══════════════════════════════════════════════════════════
   PICKS VIEW
══════════════════════════════════════════════════════════ */
function renderPicks(stocks) {
  const portSize = parseFloat(document.getElementById('portfolio-size')?.value) || 100000;
  const topPicks = stocks
    .filter(s => ['SUPER TREND','VERY BULLISH','BULLISH'].includes(s.category) && s.close > 0)
    .sort((a, b) => (SIGNAL_ORDER[a.category] ?? 9) - (SIGNAL_ORDER[b.category] ?? 9) || b.rsi - a.rsi)
    .slice(0, 15);

  if (!topPicks.length) {
    document.getElementById('picks-container').innerHTML =
      '<div class="loading-state" style="color:var(--fg3)">No bullish picks found in current data</div>';
    return;
  }

  const html = `<div class="picks-grid">${topPicks.map(s => pickCard(s, portSize)).join('')}</div>
  <div style="font-size:11px;color:var(--fg3);text-align:center;padding:8px 0">
    Swing trade · 5–15 trading days · Entry at next open · R:R 1:2
  </div>`;

  document.getElementById('picks-container').innerHTML = html;
}

function pickCard(s, portSize) {
  const catCss = CAT_CSS[s.category] || 'RANGING';
  const up = s.chgPct >= 0;
  const rsiColor = s.rsi > 70 ? 'var(--red2)' : s.rsi > 55 ? 'var(--green2)' : s.rsi < 30 ? 'var(--cyan)' : 'var(--fg2)';
  const rsiW = Math.min(100, s.rsi);

  const atr  = s.atrPct > 0 ? s.atrPct : 2;
  const slPct  = Math.min(atr * 1.0, 6).toFixed(1);
  const tgtPct = Math.min(atr * 2.0, 12).toFixed(1);
  const slPrice  = (s.close * (1 - slPct/100)).toFixed(2);
  const tgtPrice = (s.close * (1 + tgtPct/100)).toFixed(2);

  // position sizing: risk 2% of portfolio
  const riskRs    = portSize * 0.02;
  const slRs      = s.close * slPct / 100;
  const qty       = slRs > 0 ? Math.max(1, Math.floor(riskRs / slRs)) : 1;
  const invested  = (qty * s.close).toFixed(0);

  const macdBull = s.macdHist > 0;
  const sym = s.sym.replace('.NSE','');
  const dateLabel = s.date ? new Date(s.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}) : '';

  return `<div class="pick-card cat-${catCss}" onclick="openDetail('${s.sym}')">
    <div class="pick-top">
      <div>
        <div class="pick-sym">${sym}</div>
        <div class="pick-name" style="display:flex;gap:6px;align-items:center">
          <span>${s.name || sym}</span>
          ${dateLabel ? `<span style="color:var(--fg3);font-size:9px">${dateLabel}</span>` : ''}
        </div>
        <div style="margin-top:5px"><span class="sig sig-${catCss}">${s.category}</span></div>
      </div>
      <div class="pick-price">
        <div class="price">₹${s.close.toFixed(2)}</div>
        <div class="chg ${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${Math.abs(s.chgPct).toFixed(2)}%</div>
        <div style="font-size:9px;color:var(--fg3);margin-top:2px">O:${s.open.toFixed(0)} H:${s.high.toFixed(0)} L:${s.low.toFixed(0)}</div>
      </div>
    </div>

    <div class="pick-metrics">
      <div class="metric">
        <div class="metric-label">RSI</div>
        <div class="metric-val" style="color:${rsiColor}">${s.rsi.toFixed(1)}</div>
        <div class="rsi-bar-wrap"><div class="rsi-bar" style="width:${rsiW}%;background:${rsiColor}"></div></div>
      </div>
      <div class="metric">
        <div class="metric-label">MACD</div>
        <div class="metric-val ${macdBull ? 'up' : 'dn'}">${s.macdHist > 0 ? '+' : ''}${s.macdHist.toFixed(2)}</div>
        <div style="font-size:9px;color:var(--fg3);margin-top:3px">${macdBull ? '▲ Bullish' : '▼ Bearish'}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Vol</div>
        <div class="metric-val">${fmtVol(s.volume)}</div>
        <div style="font-size:9px;color:var(--fg3);margin-top:3px">shares</div>
      </div>
      <div class="metric">
        <div class="metric-label">Qty</div>
        <div class="metric-val" style="color:var(--cyan)">${qty}</div>
        <div style="font-size:9px;color:var(--fg3);margin-top:3px">₹${fmtNum(invested)}</div>
      </div>
    </div>

    <div class="pick-trade">
      <div class="trade-pill sl">
        <div class="tp-label">Stop Loss</div>
        <div class="tp-val">₹${slPrice} <span style="font-size:9px;opacity:.7">-${slPct}%</span></div>
      </div>
      <div class="trade-pill tgt">
        <div class="tp-label">Target</div>
        <div class="tp-val">₹${tgtPrice} <span style="font-size:9px;opacity:.7">+${tgtPct}%</span></div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   UNIVERSE VIEW
══════════════════════════════════════════════════════════ */
function renderUniverse(stocks) {
  const search = (document.getElementById('unv-search')?.value || '').toLowerCase();
  let filtered = stocks.filter(s => {
    if (catFilter !== 'ALL' && s.category !== catFilter) return false;
    if (search) {
      const sym = s.sym.toLowerCase();
      const nm  = (s.name || '').toLowerCase();
      if (!sym.includes(search) && !nm.includes(search)) return false;
    }
    return true;
  });

  filtered = sortStocks(filtered);

  if (!filtered.length) {
    document.getElementById('universe-container').innerHTML =
      '<div class="loading-state" style="color:var(--fg3)">No stocks match your filter</div>';
    return;
  }

  const rows = filtered.map(s => {
    const sym = s.sym.replace('.NSE','');
    const up  = s.chgPct >= 0;
    const catCss = CAT_CSS[s.category] || 'RANGING';
    const rsiColor = s.rsi > 70 ? 'var(--red2)' : s.rsi > 55 ? 'var(--green2)' : 'var(--fg2)';
    const dateLabel = s.date ? new Date(s.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : '';
    return `<div class="stock-row" onclick="openDetail('${s.sym}')">
      <div class="stock-row-left">
        <div class="sig-dot ${catCss}"></div>
        <div>
          <div class="stock-sym">${sym}</div>
          <div class="stock-name" style="display:flex;gap:6px">
            <span class="sig sig-${catCss}" style="font-size:9px;padding:1px 5px">${s.category}</span>
            ${dateLabel ? `<span style="color:var(--fg3)">${dateLabel}</span>` : ''}
          </div>
          <div style="font-size:9px;color:var(--fg3);margin-top:2px">O:${s.open.toFixed(1)} H:${s.high.toFixed(1)} L:${s.low.toFixed(1)} V:${fmtVol(s.volume)}</div>
        </div>
      </div>
      <div class="stock-row-right">
        <div class="stock-price">₹${s.close.toFixed(2)}</div>
        <div class="stock-chg ${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${Math.abs(s.chgPct).toFixed(2)}%</div>
        <div class="stock-rsi" style="color:${rsiColor}">RSI ${s.rsi.toFixed(1)}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('universe-container').innerHTML =
    `<div class="stock-list">${rows}</div>`;
}

function sortStocks(arr) {
  return arr.slice().sort((a, b) => {
    switch(sortMode) {
      case 'signal': return (SIGNAL_ORDER[a.category] ?? 9) - (SIGNAL_ORDER[b.category] ?? 9);
      case 'rsi-hi': return b.rsi - a.rsi;
      case 'rsi-lo': return a.rsi - b.rsi;
      case 'chg-hi': return b.chgPct - a.chgPct;
      case 'chg-lo': return a.chgPct - b.chgPct;
      case 'vol':    return b.volume - a.volume;
      default: return 0;
    }
  });
}

function setCatFilter(cat, el) {
  catFilter = cat;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderUniverse(Object.values(stockData));
}

function setSort(mode, el) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderUniverse(Object.values(stockData));
}

function filterUniverse() {
  renderUniverse(Object.values(stockData));
}

/* ══════════════════════════════════════════════════════════
   MARKET SUMMARY VIEW
══════════════════════════════════════════════════════════ */
function renderSummary(stocks) {
  if (!stocks.length) return;

  const counts = { 'SUPER TREND': 0, 'VERY BULLISH': 0, 'BULLISH': 0, 'WATCH OUT': 0, 'RANGING': 0 };
  let advancers = 0, decliners = 0;
  for (const s of stocks) {
    counts[s.category] = (counts[s.category] || 0) + 1;
    if (s.chgPct > 0) advancers++;
    else if (s.chgPct < 0) decliners++;
  }
  const total = stocks.length;
  const bullCount = (counts['SUPER TREND']||0) + (counts['VERY BULLISH']||0) + (counts['BULLISH']||0);
  const sentiment = bullCount / total > 0.6 ? '🟢 Broadly Bullish'
    : bullCount / total < 0.3 ? '🔴 Broadly Bearish'
    : '🟡 Mixed / Neutral';

  const avgRsi = (stocks.reduce((s, x) => s + x.rsi, 0) / total).toFixed(1);

  const sigColors = {
    'SUPER TREND': 'var(--super)', 'VERY BULLISH': 'var(--vbull)',
    'BULLISH': 'var(--bull)', 'WATCH OUT': 'var(--watch)', 'RANGING': 'var(--range)'
  };

  const signalBars = Object.entries(counts).map(([cat, cnt]) => `
    <div class="signal-bar-row">
      <div class="signal-bar-label" style="color:${sigColors[cat]}">${cat}</div>
      <div class="signal-bar-track">
        <div class="signal-bar-fill" style="width:${(cnt/total*100).toFixed(1)}%;background:${sigColors[cat]}"></div>
      </div>
      <div class="signal-bar-count">${cnt}</div>
    </div>`).join('');

  document.getElementById('summary-container').innerHTML = `
    <div class="summary-grid">
      <div class="summary-tile">
        <div class="st-label">Universe</div>
        <div class="st-val" style="color:var(--accent2)">${total}</div>
        <div class="st-sub">NSE stocks tracked</div>
      </div>
      <div class="summary-tile">
        <div class="st-label">Sentiment</div>
        <div class="st-val" style="font-size:13px;padding-top:4px">${sentiment}</div>
      </div>
      <div class="summary-tile">
        <div class="st-label">Advancers</div>
        <div class="st-val" style="color:var(--green2)">${advancers}</div>
        <div class="st-sub">stocks up today</div>
      </div>
      <div class="summary-tile">
        <div class="st-label">Decliners</div>
        <div class="st-val" style="color:var(--red2)">${decliners}</div>
        <div class="st-sub">stocks down today</div>
      </div>
      <div class="summary-tile">
        <div class="st-label">Avg RSI</div>
        <div class="st-val" style="color:var(--amber)">${avgRsi}</div>
        <div class="st-sub">universe average</div>
      </div>
      <div class="summary-tile">
        <div class="st-label">Bull %</div>
        <div class="st-val" style="color:var(--green2)">${(bullCount/total*100).toFixed(0)}%</div>
        <div class="st-sub">bullish signals</div>
      </div>
    </div>

    <div class="signal-bar-wrap">
      <div class="signal-bar-title">Signal Distribution</div>
      ${signalBars}
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Top RSI Momentum</span></div>
      <div class="stock-list">
        ${stocks.sort((a,b)=>b.rsi-a.rsi).slice(0,5).map(s => {
          const sym = s.sym.replace('.NSE','');
          const up = s.chgPct >= 0;
          return `<div class="stock-row" onclick="openDetail('${s.sym}')">
            <div class="stock-row-left">
              <div class="sig-dot ${CAT_CSS[s.category]||'RANGING'}"></div>
              <div><div class="stock-sym">${sym}</div><div class="stock-name">${s.category}</div></div>
            </div>
            <div class="stock-row-right">
              <div class="stock-price">₹${s.close.toFixed(2)}</div>
              <div class="stock-chg ${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(s.chgPct).toFixed(2)}%</div>
              <div class="stock-rsi" style="color:var(--red2)">RSI ${s.rsi.toFixed(1)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════
   DETAIL PANEL
══════════════════════════════════════════════════════════ */
async function openDetail(sym) {
  currentSym = sym;
  document.getElementById('detail-sym').textContent  = sym.replace('.NSE','');
  document.getElementById('detail-name').textContent = stockData[sym]?.name || '—';
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('detail-scroll').innerHTML =
    '<div class="loading-state"><div class="loader"></div><span>Fetching latest data…</span></div>';

  updateWlBtn(sym);

  try {
    // Always fetch fresh for detail
    const rows = await fetchStocks([sym]);
    if (rows.length) {
      const s = parseStock(rows[0]);
      stockData[sym] = s; // update cache
      renderDetail(s);
    }
  } catch(e) {
    // fall back to cached
    if (stockData[sym]) renderDetail(stockData[sym]);
    else document.getElementById('detail-scroll').innerHTML =
      `<div class="error-state">⚠ Could not load data<br><small>${e.message}</small></div>`;
  }
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  currentSym = null;
}

function renderDetail(s) {
  const sym   = s.sym.replace('.NSE','');
  const up    = s.chgPct >= 0;
  const catCss = CAT_CSS[s.category] || 'RANGING';
  document.getElementById('detail-name').textContent = s.name || sym;

  // Candle history
  const fmtCandle = (c) => {
    const d = new Date(c.expirydatetime);
    const label = isNaN(d) ? c.expirydatetime : d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
    const cup = c.close >= c.open;
    return `<div class="candle-entry">
      <div class="candle-date">${label}</div>
      <div class="candle-oc">
        <span style="color:var(--fg3);font-size:9px">O</span><span>${c.open?.toFixed(2)||'—'}</span>
        <span style="color:var(--fg3);font-size:9px">C</span><span class="${cup?'up':'dn'}">${c.close?.toFixed(2)||'—'}</span>
      </div>
      <div class="candle-hl">
        <span>H ${c.high?.toFixed(2)||'—'}</span>
        <span>L ${c.low?.toFixed(2)||'—'}</span>
      </div>
    </div>`;
  };

  const maRows = [
    ['EMA 5',   s.ema5,   s.close],
    ['EMA 9',   s.ema9,   s.close],
    ['EMA 26',  s.ema26,  s.close],
    ['SMA 10',  s.sma10,  s.close],
    ['SMA 20',  s.sma20,  s.close],
    ['SMA 50',  s.sma50,  s.close],
    ['SMA 100', s.sma100, s.close],
    ['SMA 200', s.sma200, s.close],
  ].filter(r => r[1] > 0).map(([label, ma, price]) => {
    const above = price > ma;
    return `<tr>
      <td>${label}</td>
      <td class="ma-${above?'above':'below'}">${ma.toFixed(2)}</td>
      <td class="ma-${above?'above':'below'}">${above?'▲ Above':'▼ Below'}</td>
    </tr>`;
  }).join('');

  const rsiColor = s.rsi > 70 ? 'var(--red2)' : s.rsi > 55 ? 'var(--green2)' : s.rsi < 30 ? 'var(--cyan)' : 'var(--fg2)';
  const rsiLabel = s.rsi > 70 ? 'Overbought' : s.rsi > 55 ? 'Bullish' : s.rsi < 30 ? 'Oversold' : 'Neutral';
  const macdBull = s.macdHist > 0;

  const atr    = s.atrPct > 0 ? s.atrPct : 2;
  const slPct  = Math.min(atr * 1.0, 6).toFixed(1);
  const tgtPct = Math.min(atr * 2.0, 12).toFixed(1);
  const slPrice  = (s.close * (1 - slPct/100)).toFixed(2);
  const tgtPrice = (s.close * (1 + tgtPct/100)).toFixed(2);

  document.getElementById('detail-scroll').innerHTML = `
    <!-- HERO -->
    <div class="detail-hero">
      <div class="detail-price-row">
        <div class="detail-price">₹${s.close.toFixed(2)}</div>
        <div class="detail-chg ${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(s.chgPct).toFixed(2)}%</div>
        <span class="sig sig-${catCss}" style="margin-left:auto">${s.category}</span>
      </div>
      <div class="ohlc-row">
        <div class="ohlc-item"><div class="ohlc-label">Open</div><div class="ohlc-val">₹${s.open.toFixed(2)}</div></div>
        <div class="ohlc-item"><div class="ohlc-label">High</div><div class="ohlc-val up">₹${s.high.toFixed(2)}</div></div>
        <div class="ohlc-item"><div class="ohlc-label">Low</div><div class="ohlc-val dn">₹${s.low.toFixed(2)}</div></div>
        <div class="ohlc-item"><div class="ohlc-label">Volume</div><div class="ohlc-val">${fmtVol(s.volume)}</div></div>
      </div>
    </div>

    <!-- TRADE PLAN -->
    <div class="card">
      <div class="card-header"><span class="card-title">Trade Plan · Swing 5–15 days</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px">
        <div class="trade-pill sl" style="padding:10px">
          <div class="tp-label">Stop Loss</div>
          <div class="tp-val" style="font-size:16px">₹${slPrice}</div>
          <div style="font-size:10px;color:var(--red2);margin-top:2px">-${slPct}% · 1× ATR</div>
        </div>
        <div class="trade-pill tgt" style="padding:10px">
          <div class="tp-label">Target</div>
          <div class="tp-val" style="font-size:16px">₹${tgtPrice}</div>
          <div style="font-size:10px;color:var(--green2);margin-top:2px">+${tgtPct}% · 2× ATR</div>
        </div>
      </div>
    </div>

    <!-- INDICATORS -->
    <div class="card">
      <div class="card-header"><span class="card-title">Indicators</span></div>
      <div class="indicators-grid" style="padding:12px">
        <div class="ind-card">
          <div class="ind-label">RSI (14)</div>
          <div class="ind-val" style="color:${rsiColor}">${s.rsi.toFixed(2)}</div>
          <div class="ind-sub">${rsiLabel}</div>
          <div class="rsi-bar-wrap" style="margin-top:6px"><div class="rsi-bar" style="width:${s.rsi}%;background:${rsiColor}"></div></div>
        </div>
        <div class="ind-card">
          <div class="ind-label">MACD</div>
          <div class="ind-val ${macdBull?'up':'dn'}">${s.macd.toFixed(3)}</div>
          <div class="ind-sub">Signal: ${s.macdSig.toFixed(3)}</div>
          <div class="ind-sub">Hist: <span class="${macdBull?'up':'dn'}">${s.macdHist > 0 ? '+' : ''}${s.macdHist.toFixed(3)}</span></div>
        </div>
        <div class="ind-card">
          <div class="ind-label">EMA 5 / 9</div>
          <div class="ind-val">${s.ema5.toFixed(2)}</div>
          <div class="ind-sub">EMA 9: ${s.ema9.toFixed(2)}</div>
          <div class="ind-sub ${s.ema5 > s.ema9 ? 'up' : 'dn'}">${s.ema5 > s.ema9 ? '▲ Fast > Slow' : '▼ Fast < Slow'}</div>
        </div>
        <div class="ind-card">
          <div class="ind-label">EMA 26</div>
          <div class="ind-val">${s.ema26.toFixed(2)}</div>
          <div class="ind-sub">vs Close: <span class="${s.close > s.ema26 ? 'up' : 'dn'}">${s.close > s.ema26 ? '▲ Above' : '▼ Below'}</span></div>
        </div>
      </div>
    </div>

    <!-- MA TABLE -->
    <div class="card">
      <div class="card-header"><span class="card-title">Moving Averages vs Price</span></div>
      <div style="padding:4px 0"><table class="ma-table">
        <thead><tr><th>MA</th><th>Value</th><th>Position</th></tr></thead>
        <tbody>${maRows}</tbody>
      </table></div>
    </div>

    <!-- CANDLE HISTORY -->
    <div class="card">
      <div class="card-header"><span class="card-title">Price History</span></div>
      <div class="candle-grid" style="padding:12px">
        <div class="candle-col">
          <div class="candle-period">Daily (last 6)</div>
          ${s.daily.map(fmtCandle).join('')}
        </div>
        <div class="candle-col">
          <div class="candle-period">Weekly (last 3)</div>
          ${s.weekly.map(fmtCandle).join('')}
        </div>
        <div class="candle-col">
          <div class="candle-period">Monthly (last 3)</div>
          ${s.monthly.map(fmtCandle).join('')}
        </div>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════════════════════
   WATCHLIST HELPERS
══════════════════════════════════════════════════════════ */
function toggleWatchlist() {
  if (!currentSym) return;
  if (watchlist.has(currentSym)) watchlist.delete(currentSym);
  else watchlist.add(currentSym);
  try { localStorage.setItem('wl', JSON.stringify([...watchlist])); } catch(e) {}
  updateWlBtn(currentSym);
  renderWatchlist();
  document.getElementById('badge-wl').textContent = watchlist.size;
}

function updateWlBtn(sym) {
  const btn = document.getElementById('detail-wl-btn');
  if (!btn) return;
  const inWl = watchlist.has(sym);
  btn.textContent = inWl ? '★ Watching' : '☆ Watch';
  btn.classList.toggle('in-wl', inWl);
}

   NAV
══════════════════════════════════════════════════════════ */
function switchView(name) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
}

/* ══════════════════════════════════════════════════════════
   FORMATTERS
══════════════════════════════════════════════════════════ */
function fmtVol(v) {
  if (!v) return '—';
  if (v >= 1e7) return (v/1e7).toFixed(1) + 'Cr';
  if (v >= 1e5) return (v/1e5).toFixed(1) + 'L';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return v.toString();
}
function fmtNum(n) {
  return Number(n).toLocaleString('en-IN');
}
