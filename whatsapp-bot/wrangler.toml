name = "nse-cockpit-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
WA_PROVIDER = "twilio"            # "twilio" or "meta"
FEED_REPO = "msabharwal/nse-cockpit"
FEED_BRANCH = "main"
FEED_PATH = "output/bot.json"
CLAUDE_MODEL = "claude-haiku-5-5"
# Comma-separated WhatsApp numbers (country code, digits only) allowed to use the bot.
# Leave empty to open it to everyone — only do that once the SEBI question is settled.
ALLOWED_NUMBERS = ""

# Only for WA_PROVIDER = "meta":
GRAPH_VERSION = "v21.0"
WA_TEMPLATE_NAME = ""             # approved template name, e.g. "daily_market_update"
WA_TEMPLATE_LANG = "en"

# Secrets — set with `npx wrangler secret put NAME` (never commit these):
#   Twilio:
#     TWILIO_ACCOUNT_SID     AC…
#     TWILIO_AUTH_TOKEN      (also used to verify Twilio's webhook signatures)
#     TWILIO_WHATSAPP_FROM   your Twilio WhatsApp number, e.g. +14155238886 (sandbox)
#     TWILIO_CONTENT_SID     optional HX… approved template; without it the bot only sends free-form text
#   Meta (only if WA_PROVIDER = "meta"):
#     WA_TOKEN, WA_PHONE_NUMBER_ID, WA_VERIFY_TOKEN, WA_APP_SECRET
#   Both:
#     BROADCAST_SECRET       random string; same value goes into GitHub repo secrets
#     ANTHROPIC_API_KEY      optional — enables free-text questions

[[d1_databases]]
binding = "DB"
database_name = "nse-bot"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
